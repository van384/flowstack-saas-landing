<svg width="560" height="480" viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14141A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- back card: backlog -->
  <g filter="url(#soft-shadow)" transform="rotate(-6 200 140)">
    <rect x="40" y="60" width="260" height="150" rx="16" fill="#FFFFFF" stroke="#E7E4DC" stroke-width="1.5"/>
    <rect x="64" y="86" width="70" height="20" rx="10" fill="#F1EFE8"/>
    <text x="74" y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8B8878">BACKLOG</text>
    <rect x="64" y="122" width="180" height="10" rx="5" fill="#EDEAE1"/>
    <rect x="64" y="140" width="130" height="10" rx="5" fill="#EDEAE1"/>
    <circle cx="70" cy="176" r="10" fill="#D8D5CA"/>
    <circle cx="90" cy="176" r="10" fill="#C9C6B9"/>
  </g>

  <!-- middle card: in progress -->
  <g filter="url(#soft-shadow)" transform="rotate(-2 260 220)">
    <rect x="130" y="140" width="280" height="160" rx="16" fill="#FFFFFF" stroke="#E7E4DC" stroke-width="1.5"/>
    <rect x="156" y="166" width="118" height="22" rx="11" fill="#EDEBFF"/>
    <text x="166" y="181" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4338FF">IN_PROGRESS</text>
    <rect x="156" y="204" width="220" height="12" rx="6" fill="#EFEDE5"/>
    <rect x="156" y="224" width="160" height="12" rx="6" fill="#EFEDE5"/>
    <rect x="156" y="256" width="90" height="20" rx="10" fill="#F6F4EE" stroke="#E7E4DC"/>
    <text x="166" y="270" font-family="'Inter', sans-serif" font-size="11" fill="#5B5847">Due Fri</text>
    <circle cx="360" cy="266" r="12" fill="#4338FF"/>
    <circle cx="342" cy="266" r="12" fill="#8B84FF"/>
  </g>

  <!-- front card: done -->
  <g filter="url(#soft-shadow)" transform="rotate(3 320 320)">
    <rect x="200" y="250" width="300" height="170" rx="16" fill="#14141A"/>
    <rect x="228" y="278" width="80" height="22" rx="11" fill="#2A2A33"/>
    <text x="238" y="293" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7CF29C">DONE</text>
    <rect x="228" y="318" width="230" height="12" rx="6" fill="#33333D"/>
    <rect x="228" y="338" width="170" height="12" rx="6" fill="#33333D"/>
    <path d="M228 372 l10 10 l20 -20" stroke="#7CF29C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="266" y="382" font-family="'Inter', sans-serif" font-size="12" fill="#B9B7C2">Shipped to production</text>
  </g>

  <!-- floating accent dots -->
  <circle cx="500" cy="80" r="6" fill="#4338FF"/>
  <circle cx="40" cy="360" r="5" fill="#4338FF" opacity="0.5"/>
  <circle cx="520" cy="360" r="4" fill="#14141A" opacity="0.3"/>
</svg>
