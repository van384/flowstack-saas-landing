<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#14141A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#FAFAF6"/>

  <!-- Logo mark -->
  <g transform="translate(80,70)">
    <rect x="0" y="14" width="26" height="12" rx="3" fill="#4338FF" opacity="0.35"/>
    <rect x="5" y="7" width="26" height="12" rx="3" fill="#4338FF" opacity="0.65"/>
    <rect x="10" y="0" width="26" height="12" rx="3" fill="#4338FF"/>
    <text x="48" y="24" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="26" fill="#14141A">FlowStack</text>
  </g>

  <!-- Headline -->
  <text x="80" y="230" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="58" fill="#14141A">Stop juggling tools.</text>
  <text x="80" y="300" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="58" fill="#14141A">Start stacking work.</text>
  <text x="80" y="352" font-family="Arial, sans-serif" font-size="22" fill="#5B5847">Project management that keeps your team's work in one clear flow.</text>

  <!-- Mini stacked cards, right side -->
  <g filter="url(#soft-shadow)" transform="translate(760,110) rotate(-6 120 90)">
    <rect x="0" y="0" width="220" height="120" rx="14" fill="#FFFFFF" stroke="#E7E4DC" stroke-width="1.5"/>
    <rect x="20" y="22" width="60" height="16" rx="8" fill="#F1EFE8"/>
    <rect x="20" y="52" width="150" height="9" rx="4.5" fill="#EDEAE1"/>
    <rect x="20" y="68" width="110" height="9" rx="4.5" fill="#EDEAE1"/>
  </g>
  <g filter="url(#soft-shadow)" transform="translate(830,190) rotate(-2 130 90)">
    <rect x="0" y="0" width="240" height="130" rx="14" fill="#FFFFFF" stroke="#E7E4DC" stroke-width="1.5"/>
    <rect x="22" y="24" width="96" height="18" rx="9" fill="#EDEBFF"/>
    <rect x="22" y="58" width="180" height="9" rx="4.5" fill="#EFEDE5"/>
    <rect x="22" y="76" width="130" height="9" rx="4.5" fill="#EFEDE5"/>
  </g>
  <g filter="url(#soft-shadow)" transform="translate(770,300) rotate(3 140 90)">
    <rect x="0" y="0" width="250" height="140" rx="14" fill="#14141A"/>
    <rect x="24" y="24" width="66" height="18" rx="9" fill="#2A2A33"/>
    <rect x="24" y="58" width="190" height="9" rx="4.5" fill="#33333D"/>
    <rect x="24" y="76" width="140" height="9" rx="4.5" fill="#33333D"/>
    <path d="M24 102 l8 8 l16 -16" stroke="#7CF29C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- bottom accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="#4338FF"/>
</svg>
