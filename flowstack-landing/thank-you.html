<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're on the list — FlowStack</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

<link rel="stylesheet" href="css/style.css">
<style>
  .thanks-wrap {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .thanks-card { max-width: 420px; }
  .thanks-card .success-icon { margin: 0 auto 20px; }
  .thanks-card h1 { font-size: 28px; margin-bottom: 12px; }
  .thanks-card p { color: var(--ink-soft); margin-bottom: 28px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" aria-label="FlowStack home">
      <img src="assets/images/logo.svg" alt="FlowStack" width="140" height="32">
    </a>
  </div>
</header>

<main class="thanks-wrap">
  <div class="thanks-card">
    <div class="success-icon"><i data-lucide="check" width="24" height="24"></i></div>
    <h1>You're on the list</h1>
    <p>Check your inbox for a link to set up your FlowStack workspace. If you don't see it in a few minutes, check spam.</p>
    <a href="index.html" class="btn btn-ghost">Back to home</a>
  </div>
</main>

</body>
</html>
